name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio httpx

      - name: Run backend tests
        working-directory: ./backend
        run: pytest tests/ -v
        env:
          DATABASE_URL: sqlite+aiosqlite:///./test.db
          CELERY_BROKER_URL: redis://localhost:6379/0
          CELERY_RESULT_BACKEND: redis://localhost:6379/0
          GEMINI_API_KEY: dummy
          GEMINI_SCENARIO_MODEL: gemini-1.5-flash
          GEMINI_IMAGE_MODEL: imagen-4.0-fast-generate-001
          GEMINI_EMBEDDING_MODEL: gemini-embedding-004
          USE_GEMINI_IMAGE_GEN: "False"
          STABLE_DIFFUSION_API_KEY: dummy
          ELEVENLABS_API_KEY: dummy
          USE_VOICEVOX: "False"
          CORS_ORIGINS: ""

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Run frontend lint
        working-directory: ./frontend
        run: npm run lint

      - name: Run frontend build
        working-directory: ./frontend
        run: npm run build
